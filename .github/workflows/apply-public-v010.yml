name: Apply Public v0.1.0 Source

on:
  push:
    branches:
      - feat/public-v0.1.0
    paths:
      - .bootstrap/**
      - .github/workflows/apply-public-v010.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: evidence-change-monitor-public-v010-installer
  cancel-in-progress: false

jobs:
  install:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: src
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/public-v0.1.0
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: ""

      - name: Verify and safely extract audited source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/evidence-change-monitor-unpacked /tmp/evidence-change-monitor-source.tar.gz
          mkdir -p /tmp/evidence-change-monitor-unpacked
          LC_ALL=C cat .bootstrap/part-* | base64 --decode > /tmp/evidence-change-monitor-source.tar.gz
          echo "6c70e083c64e9cfbb0b9c1fb85d951e5684e2bf097a9e81ac5d000196c7bfbca  /tmp/evidence-change-monitor-source.tar.gz" | sha256sum -c -
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import tarfile

          archive_path = Path('/tmp/evidence-change-monitor-source.tar.gz')
          destination = Path('/tmp/evidence-change-monitor-unpacked')
          max_members = 500
          max_total_size = 5 * 1024 * 1024

          with tarfile.open(archive_path, mode='r:gz') as archive:
              members = archive.getmembers()
              if not members:
                  raise SystemExit('source archive is empty')
              if len(members) > max_members:
                  raise SystemExit(f'too many archive members: {len(members)}')
              total_size = 0
              for member in members:
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts or not member.name:
                      raise SystemExit(f'unsafe archive path: {member.name!r}')
                  if member.issym() or member.islnk() or member.isdev():
                      raise SystemExit(f'unsupported archive member: {member.name}')
                  if not (member.isfile() or member.isdir()):
                      raise SystemExit(f'unsupported archive type: {member.name}')
                  total_size += member.size
                  if total_size > max_total_size:
                      raise SystemExit('archive exceeds extracted-size limit')
              archive.extractall(destination, filter='data')
          PY
          rsync -a --delete --exclude='.git/' /tmp/evidence-change-monitor-unpacked/ ./
          test ! -e .bootstrap
          test ! -e .github/workflows/apply-public-v010.yml

      - name: Run complete release gate
        run: python tools/release_check.py

      - name: Commit readable source to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'feat: publish evidence-preserving change monitor'
          git push origin HEAD:feat/public-v0.1.0
