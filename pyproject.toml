[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-change-monitor"
version = "0.1.0"
description = "Evidence-preserving snapshot, normalization, diffing, and reporting for monitored public sources."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "JINGJAYHUANG"}]
keywords = [
  "change-detection",
  "monitoring",
  "evidence",
  "provenance",
  "audit",
  "research",
  "policy",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.scripts]
evidence-monitor = "evidence_change_monitor.cli:main"

[project.urls]
Repository = "https://github.com/JINGJAYHUANG/evidence-change-monitor"
Issues = "https://github.com/JINGJAYHUANG/evidence-change-monitor/issues"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
